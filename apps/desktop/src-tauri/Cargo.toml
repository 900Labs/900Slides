[package]
name = "slides-desktop"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
authors = ["900 Labs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
slides-core = { path = "../../../crates/slides-core" }
slides-pptx = { path = "../../../crates/slides-pptx" }
slides-media = { path = "../../../crates/slides-media" }
slides-render = { path = "../../../crates/slides-render" }
slides-pdf = { path = "../../../crates/slides-pdf" }
slides-spell = { path = "../../../crates/slides-spell" }
slides-animation = { path = "../../../crates/slides-animation" }

[features]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
