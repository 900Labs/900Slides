[package]
name = "slides-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["900 Labs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
