[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["apps/desktop"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
authors = ["900 Labs"]
repository = "https://github.com/900Labs/900Slides"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zip = "2"
quick-xml = "0.36"
base64 = "0.22"
twox-hash = "1"
image = "0.25"
resvg = "0.42"
usvg = "0.42"
tiny-skia = "0.11"
printpdf = "0.7"
slides-core = { path = "crates/slides-core" }
slides-animation = { path = "crates/slides-animation" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
