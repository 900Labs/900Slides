[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["900 Labs"]
repository = "https://github.com/900Labs/900Slides"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
